services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vigilantai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigilant
      POSTGRES_PASSWORD: vigilant_dev
      POSTGRES_DB: vigilantai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
